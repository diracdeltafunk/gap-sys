name: Ubuntu apt GAP

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu-apt:
    name: Ubuntu 22.04 apt GAP
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GAP from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-dev libgap-dev

      - name: Show GAP installation
        run: |
          gap -q -c 'Print(GAPInfo.Version, "\n"); for p in GAPInfo.RootPaths do if IsExistingFile(Concatenation(p,"lib/init.g")) then Print(p,"\n"); fi; od; QUIT;'
          find /usr/include /usr/lib \( -name 'libgap-api.h' -o -name 'gap_all.h' -o -name 'libgap.so*' \)

      - name: Build
        run: cargo check

      - name: Test
        run: cargo test

      - name: GAP smoke test
        run: cargo test test_smoke_one_plus_one -- --ignored --test-threads=1
