name: Windows WSL GAP

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/gap-sys-target

jobs:
  windows-wsl-apt:
    name: Windows WSL Ubuntu apt GAP
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Ubuntu WSL with GAP and Rust
        uses: Vampire/setup-wsl@v7
        timeout-minutes: 25
        with:
          distribution: Ubuntu-22.04
          wsl-version: 2
          update: 'true'
          additional-packages: |
            build-essential
            cargo
            clang
            gap
            gap-dev
            libclang-dev
            libgap-dev
            pkg-config
            rustc

      - name: Show GAP installation in WSL
        shell: wsl-bash {0}
        run: |
          gap -q -c 'Print(GAPInfo.Version, "\n"); for p in GAPInfo.RootPaths do if IsExistingFile(Concatenation(p,"lib/init.g")) then Print(p,"\n"); fi; od; QUIT;'
          find /usr/include /usr/lib \( -name 'libgap-api.h' -o -name 'gap_all.h' -o -name 'libgap.so*' \)
          rustc --version
          cargo --version
          clang --version
          pwd
          df -h /tmp

      - name: Build in WSL
        timeout-minutes: 25
        shell: wsl-bash {0}
        run: timeout --foreground 20m cargo check -vv

      - name: Test in WSL
        timeout-minutes: 25
        shell: wsl-bash {0}
        run: timeout --foreground 20m cargo test -vv

      - name: GAP smoke test in WSL
        timeout-minutes: 10
        shell: wsl-bash {0}
        run: timeout --foreground 8m cargo test -vv test_smoke_one_plus_one -- --ignored --test-threads=1
