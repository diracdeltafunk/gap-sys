name: Windows WSL GAP

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/gap-sys-target

jobs:
  windows-wsl-apt:
    name: Windows WSL Ubuntu apt GAP
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Ubuntu WSL with GAP and Rust
        uses: Vampire/setup-wsl@v7
        timeout-minutes: 25
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          update: 'true'
          additional-packages: |
            build-essential
            clang
            curl
            gap
            gap-dev
            libclang-dev
            libgap-dev
            pkg-config

      - name: Install stable Rust in WSL
        timeout-minutes: 10
        shell: wsl-bash {0}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable

      - name: Show GAP installation in WSL
        shell: wsl-bash {0}
        run: |
          . "$HOME/.cargo/env"
          gap -q -c 'Print(GAPInfo.Version, "\n"); for p in GAPInfo.RootPaths do if IsExistingFile(Concatenation(p,"lib/init.g")) then Print(p,"\n"); fi; od; QUIT;'
          find /usr/include /usr/lib \( -name 'libgap-api.h' -o -name 'gap_all.h' -o -name 'libgap.so*' \)
          rustc --version
          cargo --version
          clang --version
          pwd
          df -h /tmp

      - name: Build in WSL
        timeout-minutes: 25
        shell: wsl-bash {0}
        run: |
          . "$HOME/.cargo/env"
          export CARGO_TARGET_DIR=/tmp/gap-sys-target
          timeout --foreground 20m cargo check -vv

      - name: Docs in WSL
        timeout-minutes: 25
        shell: wsl-bash {0}
        run: |
          . "$HOME/.cargo/env"
          export CARGO_TARGET_DIR=/tmp/gap-sys-target
          export RUSTDOCFLAGS="-D warnings"
          timeout --foreground 20m cargo doc -vv --no-deps
          timeout --foreground 20m cargo rustdoc -vv -- --document-private-items

      - name: Test in WSL
        timeout-minutes: 25
        shell: wsl-bash {0}
        run: |
          . "$HOME/.cargo/env"
          export CARGO_TARGET_DIR=/tmp/gap-sys-target
          timeout --foreground 20m cargo test -vv
