name: Windows WSL GAP

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WSL_DISTRO: gap-sys-ubuntu-22.04
  WSL_ROOTFS_URL: https://cloud-images.ubuntu.com/wsl/releases/22.04/current/ubuntu-jammy-wsl-amd64-wsl.rootfs.tar.gz
  WSL_REPO: /tmp/gap-sys-src
  WSL_TARGET_DIR: /tmp/gap-sys-target

jobs:
  windows-wsl-apt:
    name: Windows WSL Ubuntu apt GAP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Ubuntu in WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $rootfs = Join-Path $env:RUNNER_TEMP "ubuntu-jammy-wsl.rootfs.tar.gz"
          $installDir = Join-Path $env:RUNNER_TEMP "wsl-ubuntu"
          Invoke-WebRequest -Uri $env:WSL_ROOTFS_URL -OutFile $rootfs
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          wsl --import $env:WSL_DISTRO $installDir $rootfs --version 1
          wsl -d $env:WSL_DISTRO --exec uname -a

      - name: Install GAP and Rust in WSL
        shell: pwsh
        run: |
          wsl -d $env:WSL_DISTRO --exec bash -lc "set -euxo pipefail; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cargo clang gap gap-dev libclang-dev libgap-dev pkg-config rustc"

      - name: Show GAP installation in WSL
        shell: pwsh
        run: |
          $gapQuery = 'Print(GAPInfo.Version, "\n"); for p in GAPInfo.RootPaths do if IsExistingFile(Concatenation(p,"lib/init.g")) then Print(p,"\n"); fi; od; QUIT;'
          wsl -d $env:WSL_DISTRO --exec gap -q -c $gapQuery
          wsl -d $env:WSL_DISTRO --exec find /usr/include /usr/lib "(" -name "libgap-api.h" -o -name "gap_all.h" -o -name "libgap.so*" ")"

      - name: Copy source into WSL filesystem
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "gap-sys-src.tar"
          git -C "$env:GITHUB_WORKSPACE" archive --format=tar -o "$archive" HEAD
          $archiveWsl = (wsl -d $env:WSL_DISTRO --exec wslpath -a "$archive").Trim()
          wsl -d $env:WSL_DISTRO --exec bash -lc "set -euxo pipefail; rm -rf '$env:WSL_REPO'; mkdir -p '$env:WSL_REPO'; tar -C '$env:WSL_REPO' -xf '$archiveWsl'; cd '$env:WSL_REPO'; pwd; df -h /tmp; rustc --version; cargo --version; clang --version"

      - name: Build in WSL
        timeout-minutes: 25
        shell: pwsh
        run: |
          wsl -d $env:WSL_DISTRO --exec bash -lc "set -euxo pipefail; cd '$env:WSL_REPO'; CARGO_TARGET_DIR='$env:WSL_TARGET_DIR' timeout --foreground 20m cargo check -vv"

      - name: Test in WSL
        timeout-minutes: 25
        shell: pwsh
        run: |
          wsl -d $env:WSL_DISTRO --exec bash -lc "set -euxo pipefail; cd '$env:WSL_REPO'; CARGO_TARGET_DIR='$env:WSL_TARGET_DIR' timeout --foreground 20m cargo test -vv"

      - name: GAP smoke test in WSL
        timeout-minutes: 10
        shell: pwsh
        run: |
          wsl -d $env:WSL_DISTRO --exec bash -lc "set -euxo pipefail; cd '$env:WSL_REPO'; CARGO_TARGET_DIR='$env:WSL_TARGET_DIR' timeout --foreground 8m cargo test -vv test_smoke_one_plus_one -- --ignored --test-threads=1"
