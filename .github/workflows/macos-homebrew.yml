name: macOS Homebrew GAP

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-homebrew:
    name: macOS Homebrew GAP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GAP from Homebrew
        run: brew install gap-system/gap/gap

      - name: Show GAP installation
        run: |
          gap --version
          gap --print-gaproot
          gap -q -c 'Print(GAPInfo.RootPaths, "\n"); Print(LoadPackage("gapdoc"), "\n"); QUIT;'
          find "$(brew --prefix gap-system/gap/gap)" -maxdepth 3 \( -name 'libgap-api.h' -o -name 'gap_all.h' -o -name 'libgap*.dylib' \)

      - name: Build
        run: cargo check

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps
          cargo rustdoc -- --document-private-items

      - name: Test
        run: cargo test
